  newTag: 2ddc1f3e91775553537e5101e497914cdeaa8e3d
- name: flag-service
  newName: 480176645265.dkr.ecr.us-east-1.amazonaws.com/flag-service
  newTag: 2ddc1f3e91775553537e5101e497914cdeaa8e3d
- name: targeting-service
