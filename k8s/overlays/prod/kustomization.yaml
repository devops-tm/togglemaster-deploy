apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base

# Customizações específicas de produção




patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: auth-service
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: flag-service
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: targeting-service
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: evaluation-service
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: analytics-service

# Imagens com registry ECR e tag latest
images:
- name: analytics-service
  newName: 480176645265.dkr.ecr.us-east-1.amazonaws.com/analytics-service
  newTag: 2ddc1f3e91775553537e5101e497914cdeaa8e3d
- name: auth-service
