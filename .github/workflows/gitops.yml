name: GitOps

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  secrets:
    name: Sync Secrets from SSM
    uses: ./.github/workflows/secrets-sync.yml
    with:
      cluster_name: ''
      namespace: togglemaster
    secrets: inherit

  configmap:
    name: Update ConfigMap with endpoints
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get cluster name from SSM
        run: |
          CLUSTER_NAME=$(aws ssm get-parameter --name "/togglemaster/prod/cluster-name" --query "Parameter.Value" --output text)
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV

      - name: Setup kubeconfig
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Ensure namespace exists
        run: |
          kubectl create namespace togglemaster --dry-run=client -o yaml | kubectl apply -f -

      - name: Get infrastructure endpoints
        run: |
          AUTH_EP=$(aws rds describe-db-instances --db-instance-identifier rds-postgres-auth --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          FLAG_EP=$(aws rds describe-db-instances --db-instance-identifier rds-postgres-flag --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          TARGET_EP=$(aws rds describe-db-instances --db-instance-identifier rds-postgres-targeting --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          REDIS_EP=$(aws elasticache describe-cache-clusters --cache-cluster-id togglemaster-redis --query "CacheClusters[0].Endpoint.Address" --output text 2>/dev/null || echo "")

          echo "RDS_AUTH_ENDPOINT=$AUTH_EP" >> $GITHUB_ENV
          echo "RDS_FLAG_ENDPOINT=$FLAG_EP" >> $GITHUB_ENV
          echo "RDS_TARGETING_ENDPOINT=$TARGET_EP" >> $GITHUB_ENV
          echo "REDIS_ENDPOINT=$REDIS_EP" >> $GITHUB_ENV

      - name: Inject environment variables into ConfigMap
        run: |
          envsubst < k8s/base/configmap.yaml > k8s/base/configmap.yaml.tmp && mv k8s/base/configmap.yaml.tmp k8s/base/configmap.yaml

      - name: Apply ConfigMap
        run: |
          kubectl apply -f k8s/base/configmap.yaml

  jobs:
    name: Apply DB Init Jobs
    runs-on: ubuntu-latest
    needs: [secrets, configmap]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get cluster name from SSM
        run: |
          CLUSTER_NAME=$(aws ssm get-parameter --name "/togglemaster/prod/cluster-name" --query "Parameter.Value" --output text)
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV

      - name: Setup kubeconfig
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Delete old db-init jobs (if exist)
        run: |
          kubectl delete job auth-db-init flag-db-init targeting-db-init -n togglemaster --ignore-not-found

      - name: Apply db-init jobs
        run: |
          kubectl apply -k k8s/base/jobs