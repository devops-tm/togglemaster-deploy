name: GitOps

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT

      - name: Get cluster name from SSM
        run: |
          CLUSTER_NAME=$(aws ssm get-parameter --name "/togglemaster/prod/cluster-name" --query "Parameter.Value" --output text)
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV

      - name: Setup kubeconfig
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Ensure namespace exists
        run: |
          kubectl create namespace togglemaster --dry-run=client -o yaml | kubectl apply -f -

      - name: Get infrastructure endpoints
        run: |
          AUTH_EP=$(aws rds describe-db-instances --db-instance-identifier rds-postgres-auth --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          FLAG_EP=$(aws rds describe-db-instances --db-instance-identifier rds-postgres-flag --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          TARGET_EP=$(aws rds describe-db-instances --db-instance-identifier rds-postgres-targeting --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          REDIS_EP=$(aws elasticache describe-cache-clusters --cache-cluster-id togglemaster-redis --query "CacheClusters[0].Endpoint.Address" --output text 2>/dev/null || echo "")

          echo "RDS_AUTH_ENDPOINT=$AUTH_EP" >> $GITHUB_ENV
          echo "RDS_FLAG_ENDPOINT=$FLAG_EP" >> $GITHUB_ENV
          echo "RDS_TARGETING_ENDPOINT=$TARGET_EP" >> $GITHUB_ENV
          echo "REDIS_ENDPOINT=$REDIS_EP" >> $GITHUB_ENV

      - name: Inject environment variables into ConfigMap
        run: |
          envsubst < k8s/base/configmap.yaml > k8s/base/configmap.yaml.tmp && mv k8s/base/configmap.yaml.tmp k8s/base/configmap.yaml

      - name: Apply ConfigMap
        run: |
          kubectl apply -f k8s/base/configmap.yaml

      - name: Create secrets from SSM
        run: |
          for service in auth flag targeting; do
            CREDS=$(aws ssm get-parameter --name "/togglemaster/prod/$service/credentials" --with-decryption --query "Parameter.Value" --output text)
            USERNAME=$(echo $CREDS | jq -r '.username')
            PASSWORD=$(echo $CREDS | jq -r '.password')
            kubectl create secret generic db-$service-secret -n togglemaster \
              --from-literal=username=$USERNAME \
              --from-literal=password=$PASSWORD \
              --dry-run=client -o yaml | kubectl apply -f -
          done

          REDIS_CREDS=$(aws ssm get-parameter --name "/togglemaster/prod/redis/credentials" --with-decryption --query "Parameter.Value" --output text)
          REDIS_PASS=$(echo $REDIS_CREDS | jq -r '.password')
          kubectl create secret generic redis-secret -n togglemaster \
            --from-literal=password=$REDIS_PASS \
            --dry-run=client -o yaml | kubectl apply -f -