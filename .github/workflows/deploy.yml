name: GitOps Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get cluster name from SSM
        run: |
          CLUSTER_NAME=$(aws ssm get-parameter --name "/togglemaster/prod/cluster-name" --query "Parameter.Value" --output text)
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV

      - name: Setup kubeconfig
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Get infrastructure endpoints
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "AWS_ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV

          AUTH_EP=$(aws rds describe-db-instances --db-instance-identifier rds-postgres-auth --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          FLAG_EP=$(aws rds describe-db-instances --db-instance-identifier rds-postgres-flag --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          TARGET_EP=$(aws rds describe-db-instances --db-instance-identifier rds-postgres-targeting --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          REDIS_EP=$(aws elasticache describe-cache-clusters --cache-cluster-id togglemaster-redis --query "CacheClusters[0].Endpoint.Address" --output text 2>/dev/null || echo "")

          echo "RDS_AUTH_ENDPOINT=$AUTH_EP" >> $GITHUB_ENV
          echo "RDS_FLAG_ENDPOINT=$FLAG_EP" >> $GITHUB_ENV
          echo "RDS_TARGETING_ENDPOINT=$TARGET_EP" >> $GITHUB_ENV
          echo "REDIS_ENDPOINT=$REDIS_EP" >> $GITHUB_ENV

      - name: Inject environment variables into ConfigMap
        run: |
          envsubst < k8s/base/configmap.yaml > k8s/base/configmap.yaml.tmp && mv k8s/base/configmap.yaml.tmp k8s/base/configmap.yaml


      - name: Install External Secrets Operator
        run: |
          # Verifica se o operator já está instalado
          if ! kubectl get deployment external-secrets -n external-secrets >/dev/null 2>&1; then
            echo "Installing External Secrets Operator..."

            # 1. Instala os CRDs usando server-side apply (necessário porque os CRDs são grandes)[reference:0]
            kubectl apply -k "https://raw.githubusercontent.com/external-secrets/external-secrets/v2.9.0/deploy/crds/bundle.yaml" --server-side

            # 2. Cria o namespace
            kubectl create namespace external-secrets --dry-run=client -o yaml | kubectl apply -f -

            # 3. Instala o controller (deployment, service, serviceaccount, etc.)
            kubectl apply -f "https://raw.githubusercontent.com/external-secrets/external-secrets/v2.9.0/deploy/deployment.yaml"

            # 4. Aguarda o deployment ficar disponível
            kubectl wait --for=condition=available deployment/external-secrets -n external-secrets --timeout=120s
          else
            echo "External Secrets Operator already installed."
          fi

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -k k8s/overlays/prod