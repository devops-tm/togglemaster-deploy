name: GitOps Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      - name: Mask sensitive strings in logs
        run: |
          echo "::add-mask::${{ secrets.AWS_SENSITIVE_IDENTITY }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Get Actual Infrastructure
        id: tf-outputs
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          echo "AWS_ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          echo "AWS_REGION=${AWS_REGION:-us-east-1}" >> $GITHUB_ENV

          # RDS endpoints - com fallback para vazio se não existir
          AUTH_EP=$(aws rds describe-db-instances --db-instance-identifier rds-postgres-auth --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          FLAG_EP=$(aws rds describe-db-instances --db-instance-identifier rds-postgres-flag --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          TARGET_EP=$(aws rds describe-db-instances --db-instance-identifier rds-postgres-targeting --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          
          echo "RDS_AUTH_ENDPOINT=$AUTH_EP" >> $GITHUB_ENV
          echo "RDS_FLAG_ENDPOINT=$FLAG_EP" >> $GITHUB_ENV
          echo "RDS_TARGETING_ENDPOINT=$TARGET_EP" >> $GITHUB_ENV

          # Redis endpoint - usando describe-cache-clusters para cluster simples
          REDIS_EP=$(aws elasticache describe-cache-clusters --cache-cluster-id togglemaster-redis --query "CacheClusters[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          echo "REDIS_ENDPOINT=$REDIS_EP" >> $GITHUB_ENV

      - name: Check EKS Cluster and Update Kubeconfig
        run: |
          CLUSTER_NAME="togglemaster-cluster"
          
          if aws eks describe-cluster --name "$CLUSTER_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Cluster $CLUSTER_NAME encontrado. Atualizando kubeconfig..."
            aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
            echo "CLUSTER_EXISTS=true" >> $GITHUB_ENV
          else
            echo "Cluster $CLUSTER_NAME não encontrado. Pulando deploy."
            echo "CLUSTER_EXISTS=false" >> $GITHUB_ENV
          fi
            - name: Inject Environment Variables
              run: |
                envsubst < k8s/base/configmap.yaml > k8s/base/configmap.yaml.tmp && mv k8s/base/configmap.yaml.tmp k8s/base/configmap.yaml
                envsubst < k8s/base/cluster-config/aws-auth.yaml > k8s/base/cluster-config/aws-auth.yaml.tmp && mv k8s/base/cluster-config/aws-auth.yaml.tmp k8s/base/cluster-config/aws-auth.yaml

      - name: Validate Kustomize Build
        run: |
          kustomize build k8s/overlays/prod > /dev/null

      - name: Apply Kubernetes Manifests
        if: env.CLUSTER_EXISTS == 'true'
        run: |
          kubectl apply -k k8s/overlays/prod