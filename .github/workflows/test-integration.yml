name: Integration Tests (Parallel)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      environment:
        description: 'Ambiente de destino (prod, staging)'
        required: false
        type: string
        default: 'togglemaster'

jobs:
  # ============================================================
  # JOB DE CONFIGURAÇÃO
  # ============================================================
  setup:
    name: Setup - Get Endpoints & Credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get cluster name from SSM
        run: |
          CLUSTER_NAME=$(aws ssm get-parameter --name "/togglemaster/prod/cluster-name" --query "Parameter.Value" --output text)
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV
          echo "Cluster: $CLUSTER_NAME"

      - name: Setup kubeconfig
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
          kubectl cluster-info

      - name: Wait for Ingress Controller
        run: |
          echo "Aguardando Ingress Controller..."
          kubectl wait --for=condition=available deployment/ingress-nginx-controller -n ingress-nginx --timeout=120s || true
          echo "Pods do Ingress:"
          kubectl get pods -n ingress-nginx

      - name: Get Ingress LoadBalancer Hostname
        id: get-ingress
        run: |
          echo "Detalhes do serviço ingress-nginx-controller:"
          kubectl get svc ingress-nginx-controller -n ingress-nginx -o yaml

          HOSTNAME=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o json | jq -r '.status.loadBalancer.ingress[0].hostname // empty')
          if [ -z "$HOSTNAME" ]; then
            echo "ERROR: Could not retrieve LoadBalancer hostname"
            kubectl get svc ingress-nginx-controller -n ingress-nginx -o json
            exit 1
          fi
          echo "LoadBalancer hostname: $HOSTNAME"
          echo "ingress_url=$HOSTNAME" >> $GITHUB_OUTPUT

      - name: Set BASE_URL
        id: set-base-url
        run: |
          INGRESS_URL="${{ steps.get-ingress.outputs.ingress_url }}"
          BASE_URL="http://$INGRESS_URL"
          echo "BASE_URL=$BASE_URL" >> $GITHUB_ENV
          echo "BASE_URL definida como: $BASE_URL"
          echo "$BASE_URL" > /tmp/base_url.txt

      - name: Get Master Key
        id: get-master-key
        run: |
          MASTER_KEY=$(kubectl get secret togglemaster-secrets -n togglemaster -o jsonpath="{.data.MASTER_KEY}" 2>/dev/null | base64 --decode)
          if [ -z "$MASTER_KEY" ]; then
            echo "ERROR: Could not retrieve MASTER_KEY"
            exit 1
          fi
          echo "MASTER_KEY=$MASTER_KEY" >> $GITHUB_ENV
          echo "MASTER_KEY retrieved (masked)"
          echo "$MASTER_KEY" > /tmp/master_key.txt

      - name: Upload BASE_URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-url
          path: /tmp/base_url.txt

      - name: Upload MASTER_KEY artifact
        uses: actions/upload-artifact@v4
        with:
          name: master-key
          path: /tmp/master_key.txt

      - name: Debug outputs
        run: |
          echo "=== DEBUG OUTPUTS ==="
          echo "BASE_URL: $(cat /tmp/base_url.txt)"
          echo "MASTER_KEY: $(cat /tmp/master_key.txt | cut -c1-4)...$(cat /tmp/master_key.txt | tail -c5)"
          echo "====================="

  # ============================================================
  # TESTE: HEALTH CHECKS
  # ============================================================
  test-health:
    name: Health Checks
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Download BASE_URL
        uses: actions/download-artifact@v4
        with:
          name: base-url

      - name: Set BASE_URL
        run: |
          BASE_URL=$(cat base_url.txt)
          echo "BASE_URL=$BASE_URL" >> $GITHUB_ENV
          echo "BASE_URL lida: $BASE_URL"
          if [ -z "$BASE_URL" ]; then
            echo "ERROR: BASE_URL is empty"
            exit 1
          fi

      - name: Health Check - Auth Service
        run: |
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/auth/health" 2>/dev/null)
          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "ERROR: Auth service health check failed (HTTP $HEALTH_STATUS)"
            exit 1
          fi
          echo "Auth service is healthy"

      - name: Health Check - Flag Service
        run: |
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/flag/health" 2>/dev/null)
          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "ERROR: Flag service health check failed (HTTP $HEALTH_STATUS)"
            exit 1
          fi
          echo "Flag service is healthy"

      - name: Health Check - Targeting Service
        run: |
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/targeting/health" 2>/dev/null)
          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "ERROR: Targeting service health check failed (HTTP $HEALTH_STATUS)"
            exit 1
          fi
          echo "Targeting service is healthy"

      - name: Health Check - Evaluation Service
        run: |
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/evaluation/health" 2>/dev/null)
          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "ERROR: Evaluation service health check failed (HTTP $HEALTH_STATUS)"
            exit 1
          fi
          echo "Evaluation service is healthy"

      - name: Health Check - Analytics Service
        run: |
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/analytics/health" 2>/dev/null)
          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "ERROR: Analytics service health check failed (HTTP $HEALTH_STATUS)"
            exit 1
          fi
          echo "Analytics service is healthy"

  # ============================================================
  # TESTE: AUTENTICAÇÃO
  # ============================================================
  test-auth:
    name: Authentication Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Download BASE_URL and MASTER_KEY
        uses: actions/download-artifact@v4
        with:
          name: base-url

      - name: Download MASTER_KEY
        uses: actions/download-artifact@v4
        with:
          name: master-key

      - name: Set environment variables
        run: |
          BASE_URL=$(cat base_url.txt)
          MASTER_KEY=$(cat master_key.txt)
          echo "BASE_URL=$BASE_URL" >> $GITHUB_ENV
          echo "MASTER_KEY=$MASTER_KEY" >> $GITHUB_ENV
          echo "BASE_URL lida: $BASE_URL"
          if [ -z "$BASE_URL" ] || [ -z "$MASTER_KEY" ]; then
            echo "ERROR: BASE_URL or MASTER_KEY is empty"
            exit 1
          fi

      - name: Test Invalid API Key
        run: |
          RESPONSE=$(curl -s -w "%{http_code}" -X GET "$BASE_URL/flag/flags" \
            -H "Authorization: Bearer invalid-key" 2>/dev/null)
          HTTP_STATUS=$(echo "$RESPONSE" | tail -c 4)
          if [ "$HTTP_STATUS" != "401" ]; then
            echo "ERROR: Expected 401 for invalid key, got $HTTP_STATUS"
            exit 1
          fi
          echo "Invalid key properly rejected (HTTP $HTTP_STATUS)"

      - name: Test Missing Authorization Header
        run: |
          RESPONSE=$(curl -s -w "%{http_code}" -X GET "$BASE_URL/flag/flags" 2>/dev/null)
          HTTP_STATUS=$(echo "$RESPONSE" | tail -c 4)
          if [ "$HTTP_STATUS" != "401" ]; then
            echo "ERROR: Expected 401 for missing header, got $HTTP_STATUS"
            exit 1
          fi
          echo "Missing header properly rejected (HTTP $HTTP_STATUS)"

      - name: Generate API Key
        id: generate-key
        run: |
          AUTH_RESPONSE=$(curl -s -X POST "${BASE_URL}/validate/admin/keys" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${MASTER_KEY}" \
            -d '{"name": "test-api-key"}')
          API_KEY=$(echo "$AUTH_RESPONSE" | jq -r '.key // empty')
          if [ -z "$API_KEY" ]; then
            echo "ERROR: Authentication failed. Response: $AUTH_RESPONSE"
            exit 1
          fi
          echo "API_KEY=$API_KEY" >> $GITHUB_ENV
          echo "API Key generated"

      - name: Validate Generated API Key
        run: |
          RESPONSE=$(curl -s -w "%{http_code}" -X GET "$BASE_URL/flag/flags" \
            -H "Authorization: Bearer ${API_KEY}" 2>/dev/null)
          HTTP_STATUS=$(echo "$RESPONSE" | tail -c 4)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Generated key failed (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Generated key works correctly"

  # ============================================================
  # TESTE: FLAGS CRUD
  # ============================================================
  test-flags:
    name: Flag CRUD Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Download BASE_URL and MASTER_KEY
        uses: actions/download-artifact@v4
        with:
          name: base-url

      - name: Download MASTER_KEY
        uses: actions/download-artifact@v4
        with:
          name: master-key

      - name: Set environment
        run: |
          BASE_URL=$(cat base_url.txt)
          MASTER_KEY=$(cat master_key.txt)
          echo "BASE_URL=$BASE_URL" >> $GITHUB_ENV
          echo "MASTER_KEY=$MASTER_KEY" >> $GITHUB_ENV
          if [ -z "$BASE_URL" ]; then
            echo "ERROR: BASE_URL is empty"
            exit 1
          fi

      - name: Generate API Key
        id: auth
        run: |
          AUTH_RESPONSE=$(curl -s -X POST "${BASE_URL}/validate/admin/keys" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${MASTER_KEY}" \
            -d '{"name": "flag-test-key"}')
          API_KEY=$(echo "$AUTH_RESPONSE" | jq -r '.key // empty')
          if [ -z "$API_KEY" ]; then
            echo "ERROR: Failed to generate API key"
            exit 1
          fi
          echo "API_KEY=$API_KEY" >> $GITHUB_ENV

      - name: Create Flag
        id: create
        run: |
          FLAG_NAME="test-flag-$(date +%s)"
          echo "FLAG_NAME=$FLAG_NAME" >> $GITHUB_ENV
          FLAG_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${BASE_URL}/flag/flags" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${API_KEY}" \
            -d "{\"name\":\"$FLAG_NAME\",\"description\":\"Test flag\",\"is_enabled\":true}")
          HTTP_STATUS=$(echo "$FLAG_RESPONSE" | tail -n 1)
          BODY=$(echo "$FLAG_RESPONSE" | head -n -1)
          if [ "$HTTP_STATUS" != "201" ]; then
            echo "ERROR: Failed to create flag (HTTP $HTTP_STATUS). Response: $BODY"
            exit 1
          fi
          echo "Flag created: $FLAG_NAME"

      - name: List Flags
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "${BASE_URL}/flag/flags" \
            -H "Authorization: Bearer ${API_KEY}")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Failed to list flags (HTTP $HTTP_STATUS)"
            exit 1
          fi
          COUNT=$(echo "$RESPONSE" | head -n -1 | jq '. | length')
          echo "Found $COUNT flags"

      - name: Update Flag
        run: |
          UPDATE_RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT "${BASE_URL}/flag/flags/${FLAG_NAME}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${API_KEY}" \
            -d '{"description": "Updated", "is_enabled": false}')
          HTTP_STATUS=$(echo "$UPDATE_RESPONSE" | tail -n 1)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Failed to update flag (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Flag updated"

      - name: Delete Flag
        run: |
          DELETE_RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE "${BASE_URL}/flag/flags/${FLAG_NAME}" \
            -H "Authorization: Bearer ${API_KEY}")
          HTTP_STATUS=$(echo "$DELETE_RESPONSE" | tail -n 1)
          if [ "$HTTP_STATUS" != "204" ]; then
            echo "ERROR: Failed to delete flag (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Flag deleted"

      - name: Verify Flag Deleted
        run: |
          GET_RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "${BASE_URL}/flag/flags/${FLAG_NAME}" \
            -H "Authorization: Bearer ${API_KEY}")
          HTTP_STATUS=$(echo "$GET_RESPONSE" | tail -n 1)
          if [ "$HTTP_STATUS" != "404" ]; then
            echo "ERROR: Expected 404 for deleted flag, got $HTTP_STATUS"
            exit 1
          fi
          echo "Deletion verified"

  # ============================================================
  # TESTE: TARGETING
  # ============================================================
  test-targeting:
    name: Targeting Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Download BASE_URL and MASTER_KEY
        uses: actions/download-artifact@v4
        with:
          name: base-url

      - name: Download MASTER_KEY
        uses: actions/download-artifact@v4
        with:
          name: master-key

      - name: Set environment
        run: |
          BASE_URL=$(cat base_url.txt)
          MASTER_KEY=$(cat master_key.txt)
          echo "BASE_URL=$BASE_URL" >> $GITHUB_ENV
          echo "MASTER_KEY=$MASTER_KEY" >> $GITHUB_ENV

      - name: Generate API Key
        id: auth
        run: |
          AUTH_RESPONSE=$(curl -s -X POST "${BASE_URL}/validate/admin/keys" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${MASTER_KEY}" \
            -d '{"name": "targeting-test-key"}')
          API_KEY=$(echo "$AUTH_RESPONSE" | jq -r '.key // empty')
          echo "API_KEY=$API_KEY" >> $GITHUB_ENV

      - name: Create Flag for Targeting
        id: create-flag
        run: |
          FLAG_NAME="targeting-flag-$(date +%s)"
          echo "FLAG_NAME=$FLAG_NAME" >> $GITHUB_ENV
          FLAG_RESPONSE=$(curl -s -X POST "${BASE_URL}/flag/flags" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${API_KEY}" \
            -d "{\"name\":\"$FLAG_NAME\",\"description\":\"Targeting test\",\"is_enabled\":true}")
          CREATED=$(echo "$FLAG_RESPONSE" | jq -r '.name // empty')
          if [ "$CREATED" != "$FLAG_NAME" ]; then
            echo "ERROR: Failed to create flag"
            exit 1
          fi
          echo "Flag created: $FLAG_NAME"

      - name: Create Targeting Rule
        run: |
          TARGETING_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${BASE_URL}/targeting/rules" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${API_KEY}" \
            -d "{\"flag_name\":\"$FLAG_NAME\",\"is_enabled\":true,\"rules\":{\"type\":\"PERCENTAGE\",\"value\":50}}")
          HTTP_STATUS=$(echo "$TARGETING_RESPONSE" | tail -n 1)
          if [ "$HTTP_STATUS" != "201" ]; then
            echo "ERROR: Failed to create targeting rule (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Targeting rule created"

      - name: Verify Targeting Rule
        run: |
          GET_RESPONSE=$(curl -s -X GET "${BASE_URL}/targeting/rules?flag_name=${FLAG_NAME}" \
            -H "Authorization: Bearer ${API_KEY}")
          if echo "$GET_RESPONSE" | jq -e '.[0]' >/dev/null 2>&1; then
            echo "Targeting rule verified"
          else
            echo "ERROR: Could not retrieve targeting rule"
            exit 1
          fi

      - name: Cleanup
        run: |
          curl -s -X DELETE "${BASE_URL}/flag/flags/${FLAG_NAME}" \
            -H "Authorization: Bearer ${API_KEY}" || true
          echo "Cleanup done"

  # ============================================================
  # TESTE: EVALUATION
  # ============================================================
  test-evaluation:
    name: Evaluation Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Download BASE_URL and MASTER_KEY
        uses: actions/download-artifact@v4
        with:
          name: base-url

      - name: Download MASTER_KEY
        uses: actions/download-artifact@v4
        with:
          name: master-key

      - name: Set environment
        run: |
          BASE_URL=$(cat base_url.txt)
          MASTER_KEY=$(cat master_key.txt)
          echo "BASE_URL=$BASE_URL" >> $GITHUB_ENV
          echo "MASTER_KEY=$MASTER_KEY" >> $GITHUB_ENV

      - name: Generate API Key
        id: auth
        run: |
          AUTH_RESPONSE=$(curl -s -X POST "${BASE_URL}/validate/admin/keys" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${MASTER_KEY}" \
            -d '{"name": "eval-test-key"}')
          API_KEY=$(echo "$AUTH_RESPONSE" | jq -r '.key // empty')
          echo "API_KEY=$API_KEY" >> $GITHUB_ENV

      - name: Create Flag for Evaluation
        id: create-flag
        run: |
          FLAG_NAME="eval-flag-$(date +%s)"
          echo "FLAG_NAME=$FLAG_NAME" >> $GITHUB_ENV
          FLAG_RESPONSE=$(curl -s -X POST "${BASE_URL}/flag/flags" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${API_KEY}" \
            -d "{\"name\":\"$FLAG_NAME\",\"description\":\"Evaluation test\",\"is_enabled\":true}")
          CREATED=$(echo "$FLAG_RESPONSE" | jq -r '.name // empty')
          if [ "$CREATED" != "$FLAG_NAME" ]; then
            echo "ERROR: Failed to create flag"
            exit 1
          fi
          echo "Flag created: $FLAG_NAME"

      - name: Create Targeting Rule (100%)
        run: |
          TARGETING_RESPONSE=$(curl -s -X POST "${BASE_URL}/targeting/rules" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${API_KEY}" \
            -d "{\"flag_name\":\"$FLAG_NAME\",\"is_enabled\":true,\"rules\":{\"type\":\"PERCENTAGE\",\"value\":100}}")
          RULE_CREATED=$(echo "$TARGETING_RESPONSE" | jq -r '.flag_name // empty')
          if [ "$RULE_CREATED" != "$FLAG_NAME" ]; then
            echo "ERROR: Failed to create targeting rule"
            exit 1
          fi
          echo "Targeting rule created"

      - name: Evaluate Flag
        run: |
          EVAL_RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
            "${BASE_URL}/evaluation/evaluate?user_id=user-123&flag_name=${FLAG_NAME}" \
            -H "Authorization: Bearer ${API_KEY}")
          HTTP_STATUS=$(echo "$EVAL_RESPONSE" | tail -n 1)
          BODY=$(echo "$EVAL_RESPONSE" | head -n -1)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Evaluation failed (HTTP $HTTP_STATUS). Response: $BODY"
            exit 1
          fi
          ENABLED=$(echo "$BODY" | jq -r '.enabled // false')
          if [ "$ENABLED" != "true" ]; then
            echo "ERROR: Flag should be enabled, got $ENABLED"
            exit 1
          fi
          echo "Evaluation successful: enabled=$ENABLED"

      - name: Cleanup
        run: |
          curl -s -X DELETE "${BASE_URL}/flag/flags/${FLAG_NAME}" \
            -H "Authorization: Bearer ${API_KEY}" || true
          echo "Cleanup done"

  # ============================================================
  # TESTE: PERFORMANCE
  # ============================================================
  test-performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Download BASE_URL
        uses: actions/download-artifact@v4
        with:
          name: base-url

      - name: Set BASE_URL
        run: |
          BASE_URL=$(cat base_url.txt)
          echo "BASE_URL=$BASE_URL" >> $GITHUB_ENV

      - name: API Latency Test
        run: |
          echo "Testando latência da API (10 tentativas)..."
          TIMES=10
          TOTAL_TIME=0
          for i in $(seq 1 $TIMES); do
            TIME=$(curl -s -o /dev/null -w "%{time_total}" "$BASE_URL/flag/health" 2>/dev/null)
            echo "  Tentativa $i: ${TIME}s"
            TOTAL_TIME=$(echo "$TOTAL_TIME + $TIME" | bc)
          done
          AVG_TIME=$(echo "scale=3; $TOTAL_TIME / $TIMES" | bc)
          echo "Tempo médio de resposta: ${AVG_TIME}s"
          if (( $(echo "$AVG_TIME > 2.0" | bc -l) )); then
            echo "WARNING: Average response time is high: ${AVG_TIME}s"
          else
            echo "Performance OK"
          fi

  # ============================================================
  # TESTE: END-TO-END
  # ============================================================
  test-e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Download BASE_URL and MASTER_KEY
        uses: actions/download-artifact@v4
        with:
          name: base-url

      - name: Download MASTER_KEY
        uses: actions/download-artifact@v4
        with:
          name: master-key

      - name: Set environment
        run: |
          BASE_URL=$(cat base_url.txt)
          MASTER_KEY=$(cat master_key.txt)
          echo "BASE_URL=$BASE_URL" >> $GITHUB_ENV
          echo "MASTER_KEY=$MASTER_KEY" >> $GITHUB_ENV

      - name: E2E Test - Full Flow
        run: |
          echo "=========================================="
          echo "END-TO-END TEST"
          echo "=========================================="

          # 1. Generate API Key
          AUTH_RESPONSE=$(curl -s -X POST "${BASE_URL}/validate/admin/keys" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${MASTER_KEY}" \
            -d '{"name": "e2e-test-key"}')
          API_KEY=$(echo "$AUTH_RESPONSE" | jq -r '.key // empty')
          if [ -z "$API_KEY" ]; then
            echo "ERROR: Failed to generate API key"
            exit 1
          fi
          echo "✓ API Key generated"

          # 2. Create Flag
          FLAG_NAME="e2e-flag-$(date +%s)"
          FLAG_RESPONSE=$(curl -s -X POST "${BASE_URL}/flag/flags" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${API_KEY}" \
            -d "{\"name\":\"$FLAG_NAME\",\"description\":\"E2E test\",\"is_enabled\":true}")
          CREATED_NAME=$(echo "$FLAG_RESPONSE" | jq -r '.name // empty')
          if [ "$CREATED_NAME" != "$FLAG_NAME" ]; then
            echo "ERROR: Failed to create flag"
            exit 1
          fi
          echo "✓ Flag created: $FLAG_NAME"

          # 3. Create Targeting Rule
          TARGETING_RESPONSE=$(curl -s -X POST "${BASE_URL}/targeting/rules" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${API_KEY}" \
            -d "{\"flag_name\":\"$FLAG_NAME\",\"is_enabled\":true,\"rules\":{\"type\":\"PERCENTAGE\",\"value\":100}}")
          RULE_CREATED=$(echo "$TARGETING_RESPONSE" | jq -r '.flag_name // empty')
          if [ "$RULE_CREATED" != "$FLAG_NAME" ]; then
            echo "ERROR: Failed to create targeting rule"
            exit 1
          fi
          echo "✓ Targeting rule created"

          # 4. Evaluate Flag
          EVAL_RESPONSE=$(curl -s -X GET \
            "${BASE_URL}/evaluation/evaluate?user_id=e2e-user&flag_name=${FLAG_NAME}" \
            -H "Authorization: Bearer ${API_KEY}")
          ENABLED=$(echo "$EVAL_RESPONSE" | jq -r '.enabled // false')
          if [ "$ENABLED" != "true" ]; then
            echo "ERROR: Flag evaluation failed"
            exit 1
          fi
          echo "✓ Flag evaluated: enabled=$ENABLED"

          # 5. Cleanup
          curl -s -X DELETE "${BASE_URL}/flag/flags/${FLAG_NAME}" \
            -H "Authorization: Bearer ${API_KEY}"
          echo "✓ Cleanup completed"
          echo "=========================================="
          echo "✅ E2E test passed"
          echo "=========================================="

  # ============================================================
  # RELATÓRIO FINAL
  # ============================================================
  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [test-health, test-auth, test-flags, test-targeting, test-evaluation, test-performance, test-e2e]
    if: always()
    steps:
      - name: Check overall status
        run: |
          echo "=========================================="
          echo "✅ INTEGRATION TESTS COMPLETED"
          echo "=========================================="
          echo ""
          echo "Jobs executed in parallel:"
          echo "  - Health Checks"
          echo "  - Authentication Tests"
          echo "  - Flag CRUD Tests"
          echo "  - Targeting Tests"
          echo "  - Evaluation Tests"
          echo "  - Performance Tests"
          echo "  - End-to-End Tests"
          echo ""
          if [ "${{ needs.test-health.result }}" != "success" ] || \
             [ "${{ needs.test-auth.result }}" != "success" ] || \
             [ "${{ needs.test-flags.result }}" != "success" ] || \
             [ "${{ needs.test-targeting.result }}" != "success" ] || \
             [ "${{ needs.test-evaluation.result }}" != "success" ] || \
             [ "${{ needs.test-performance.result }}" != "success" ] || \
             [ "${{ needs.test-e2e.result }}" != "success" ]; then
            echo "⚠️ Some tests failed. Check individual job logs."
            exit 1
          else
            echo "✅ All tests passed successfully!"
          fi